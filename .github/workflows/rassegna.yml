name: Aggiorna rassegna stampa

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Scarica i feed e genera articles.json
        run: python3 build_cache.py cache

      - name: Controlla che il file sia stato creato
        run: |
          test -s cache/articles.json
          echo "Dimensione: $(wc -c < cache/articles.json) byte"

      - name: Carica su Altervista via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          # GitHub avvia i blocchi "run" con "bash -e", che interrompe tutto al
          # primo comando fallito. Va disattivato, altrimenti curl muore prima
          # che i messaggi d'errore qui sotto vengano stampati.
          set +e
          set -u -o pipefail

          # Toglie a-capo e spazi finiti per sbaglio dentro i segreti.
          FTP_HOST="$(printf '%s' "${FTP_HOST:-}" | tr -d '\r\n' | xargs)"
          FTP_USER="$(printf '%s' "${FTP_USER:-}" | tr -d '\r\n' | xargs)"
          FTP_PATH="$(printf '%s' "${FTP_PATH:-}" | tr -d '\r\n' | xargs)"
          FTP_PASS="$(printf '%s' "${FTP_PASS:-}" | tr -d '\r\n')"

          # Mostra solo QUANTI caratteri contiene ogni segreto, mai il contenuto.
          echo "Controllo dei segreti (lunghezza in caratteri):"
          echo "  FTP_HOST = ${#FTP_HOST}"
          echo "  FTP_USER = ${#FTP_USER}"
          echo "  FTP_PASS = ${#FTP_PASS}"
          echo "  FTP_PATH = ${#FTP_PATH}"

          MANCANTI=""
          [ -z "$FTP_HOST" ] && MANCANTI="$MANCANTI FTP_HOST"
          [ -z "$FTP_USER" ] && MANCANTI="$MANCANTI FTP_USER"
          [ -z "$FTP_PASS" ] && MANCANTI="$MANCANTI FTP_PASS"
          [ -z "$FTP_PATH" ] && MANCANTI="$MANCANTI FTP_PATH"
          if [ -n "$MANCANTI" ]; then
            echo ""
            echo "=============================================="
            echo "SEGRETI VUOTI O INESISTENTI:$MANCANTI"
            echo "=============================================="
            echo "GitHub non trova questi valori. Le cause tipiche:"
            echo ""
            echo "1) Sono stati creati nella scheda VARIABLES invece che"
            echo "   nella scheda SECRETS. Sono due schede diverse nella"
            echo "   stessa pagina: Settings -> Secrets and variables ->"
            echo "   Actions. Servono in 'Secrets' (Repository secrets)."
            echo "2) Il nome non coincide: deve essere esattamente"
            echo "   FTP_HOST, FTP_USER, FTP_PASS, FTP_PATH"
            echo "   (maiuscole e trattino basso compresi)."
            exit 1
          fi

          DEST="ftp://${FTP_HOST}/${FTP_PATH}/articles.json"
          echo "Destinazione: ${DEST}"

          # FTP in chiaro: su Altervista il certificato del server non
          # corrisponde al nome dell'host, quindi la connessione cifrata non e'
          # utilizzabile e tentarla genera solo un errore fuorviante (codice 60).
          curl --fail --silent --show-error \
               --user "${FTP_USER}:${FTP_PASS}" \
               --upload-file cache/articles.json "${DEST}"
          ESITO=$?
          if [ $ESITO -eq 0 ]; then
            echo "Caricato correttamente."
            exit 0
          fi

          echo ""
          echo "=============================================="
          echo "CARICAMENTO FALLITO — codice curl $ESITO"
          echo "=============================================="
          case $ESITO in
            67)
              echo "LOGIN RIFIUTATO: nome utente o password FTP sbagliati."
              echo ""
              echo "Su Altervista la password FTP e' DIVERSA da quella con cui"
              echo "entri nel pannello: va impostata a parte nella sezione FTP."
              echo "Confronta la lunghezza di FTP_PASS qui sopra con i"
              echo "caratteri della password che funziona nel terminale."
              ;;
            9|550)
              echo "PERCORSO NON VALIDO: la cartella di FTP_PATH non esiste."
              echo "FTP_PATH vale ora: '${FTP_PATH}'"
              echo "Serve il percorso dalla radice FTP alla cartella cache,"
              echo "SENZA barra iniziale (es. 'rassegna-stampa/cache')."
              echo "La cartella deve gia' esistere: il caricamento non la crea."
              ;;
            6|7)
              echo "SERVER IRRAGGIUNGIBILE: controlla FTP_HOST."
              echo "Per Altervista e' del tipo ftp.NOMESITO.altervista.org"
              ;;
            *)
              echo "Codici curl: https://curl.se/libcurl/c/libcurl-errors.html"
              ;;
          esac
          exit 1

      - name: Riepilogo
        run: |
          echo "### Rassegna aggiornata" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          d = json.load(open('cache/articles.json'))
          print('- Articoli:', len(d['articles']))
          fonti = sorted({a['source'] for a in d['articles']})
          print('- Fonti che hanno risposto:', len(fonti))
          print('  ', ', '.join(fonti))
          " >> $GITHUB_STEP_SUMMARY
