name: Aggiorna rassegna stampa

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Scarica i feed e genera articles.json
        run: python3 build_cache.py cache

      - name: Controlla che il file sia stato creato
        run: |
          test -s cache/articles.json
          echo "Dimensione: $(wc -c < cache/articles.json) byte"

      - name: Salva le notizie nel deposito
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f cache/articles.json

          if git diff --staged --quiet; then
            echo "Nessuna novita': le notizie sono identiche a quelle di prima."
            exit 0
          fi

          git commit -m "Rassegna aggiornata $(date -u '+%d/%m/%Y %H:%M UTC')"
          git push
          echo "Notizie salvate nel deposito."

      - name: Riepilogo
        run: |
          echo "### Rassegna aggiornata" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          d = json.load(open('cache/articles.json'))
          print('- Articoli:', len(d['articles']))
          fonti = sorted({a['source'] for a in d['articles']})
          print('- Fonti che hanno risposto:', len(fonti))
          print('  ', ', '.join(fonti))
          " >> $GITHUB_STEP_SUMMARY
