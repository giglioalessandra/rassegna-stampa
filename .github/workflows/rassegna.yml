name: Aggiorna rassegna stampa

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Scarica i feed e genera articles.json
        run: python3 build_cache.py cache

      - name: Controlla che il file sia stato creato
        run: |
          test -s cache/articles.json
          echo "Dimensione: $(wc -c < cache/articles.json) byte"

      - name: Carica su Altervista via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST:-}" ]; then
            echo "ERRORE: i segreti FTP non sono impostati."
            exit 1
          fi
          DEST="ftp://${FTP_HOST}/${FTP_PATH}/articles.json"
          if curl --ssl-reqd --fail --silent --show-error \
                  --user "${FTP_USER}:${FTP_PASS}" \
                  --upload-file cache/articles.json "${DEST}"; then
            echo "Caricato con connessione cifrata (FTPS)."
          else
            echo "FTPS non disponibile, uso FTP normale."
            curl --fail --silent --show-error \
                 --user "${FTP_USER}:${FTP_PASS}" \
                 --upload-file cache/articles.json "${DEST}"
            echo "Caricato via FTP."
          fi

      - name: Riepilogo
        run: |
          echo "### Rassegna aggiornata" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          d = json.load(open('cache/articles.json'))
          print('- Articoli:', len(d['articles']))
          fonti = sorted({a['source'] for a in d['articles']})
          print('- Fonti che hanno risposto:', len(fonti))
          print('  ', ', '.join(fonti))
          " >> $GITHUB_STEP_SUMMARY
